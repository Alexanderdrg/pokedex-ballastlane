server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: pokedex-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/pokedex;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  cache:
    type: caffeine
    cache-names: pokeapi-list,pokeapi-pokemon,pokeapi-species,pokeapi-evolution
    caffeine:
      spec: maximumSize=3000,expireAfterWrite=6h,recordStats
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

pokeapi:
  base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
  connect-timeout: 3s
  read-timeout: 10s
  parallelism: 8

security:
  jwt:
    # Override in any real environment: JWT_SECRET must be >= 32 bytes
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    expiration: ${JWT_EXPIRATION:2h}
    issuer: pokedex-api

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    users: ${SEED_USERS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches

springdoc:
  swagger-ui:
    path: /swagger-ui.html
